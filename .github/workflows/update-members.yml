name: 👥 Update Members in Profile README

# Regenerates the members grid at the bottom of profile/README.md from the FULL
# organization member list, then commits only when the rendered block changed.
#
# This lists every member, including those whose membership visibility is
# private, which is a deliberate org decision. Two consequences to keep in mind:
#
#   1. It needs ORG_INVITE_TOKEN (read:org). The built-in GITHUB_TOKEN is
#      repository-scoped and only ever sees public members, so if the secret goes
#      missing this would quietly drop from 45 people to 5. The shrink guard
#      below exists to make that fail loudly instead.
#   2. Anyone who would rather not be listed can add their username to
#      .github/members-optout.txt and the next run drops them.

on:
  schedule:
    # Every 6 hours, offset off the hour because scheduled runs queue on the hour.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow the list to shrink by more than half (use after real departures)
        type: boolean
        default: false
  push:
    branches: [main]
    # So editing the generator, the opt-out list, or the README takes effect at once.
    #
    # This job commits profile/README.md and also triggers on it, which looks
    # recursive. It is not: pushes made with the built-in GITHUB_TOKEN do not
    # create workflow runs (only workflow_dispatch and repository_dispatch are
    # exempt from that rule), and the generator is idempotent regardless.
    paths:
      - .github/workflows/update-members.yml
      - .github/members-optout.txt
      - profile/README.md

permissions:
  contents: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update-members:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require the org-scoped token
        env:
          ORG_TOKEN: ${{ secrets.ORG_INVITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_TOKEN}" ]; then
            echo "::error::ORG_INVITE_TOKEN is not set. Listing private members needs a" \
              "token with read:org; GITHUB_TOKEN only sees public members and would" \
              "silently shrink the grid. Add the secret, or switch the script back to" \
              "listPublicMembers."
            exit 1
          fi
          echo "ORG_INVITE_TOKEN is present."

      - name: Regenerate members grid
        uses: actions/github-script@v9
        with:
          # Needs read:org to see private memberships. GITHUB_TOKEN cannot.
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'profile/README.md';
            const OPTOUT = '.github/members-optout.txt';
            const START = '<!-- MEMBERS:START -->';
            const END = '<!-- MEMBERS:END -->';
            const PER_ROW = 6;
            const allowShrink = context.payload.inputs?.allow_shrink === 'true';

            // Anyone who asks not to be listed. One username per line, # comments ok.
            let optOut = new Set();
            if (fs.existsSync(OPTOUT)) {
              // Split on \r?\n and strip comments unanchored: a CRLF file would
              // otherwise leave a trailing \r that defeats an $-anchored regex,
              // silently keeping a commented line's text in the set. The web
              // editor and Windows contributors both produce CRLF.
              optOut = new Set(
                fs
                  .readFileSync(OPTOUT, 'utf8')
                  .split(/\r?\n/)
                  .map((l) => l.replace(/#.*/, '').trim().toLowerCase())
                  .filter(Boolean)
              );
              core.info(`Opt-out list holds ${optOut.size} username(s).`);
            }

            // Every member, public and private. Requires read:org.
            let members;
            try {
              members = await github.paginate(github.rest.orgs.listMembers, {
                org: context.repo.owner,
                per_page: 100,
              });
            } catch (e) {
              core.setFailed(
                `listMembers failed (${e.status} ${e.message}). ORG_INVITE_TOKEN likely ` +
                  'lacks read:org or has expired.'
              );
              return;
            }

            if (members.length === 0) {
              core.setFailed(
                'listMembers returned nobody. Refusing to wipe the grid, since an API ' +
                  'hiccup should not look like an empty org.'
              );
              return;
            }

            const listed = members.filter((m) => !optOut.has(m.login.toLowerCase()));
            core.info(`${members.length} member(s), ${listed.length} after opt-outs.`);

            const readme = fs.readFileSync(path, 'utf8');
            const startIdx = readme.indexOf(START);
            const endIdx = readme.indexOf(END);
            if (startIdx === -1 || endIdx === -1) {
              core.setFailed(`Missing ${START} / ${END} markers in ${path}.`);
              return;
            }

            // Guard the one failure mode that looks like success: if the token loses
            // read:org, listMembers still returns 200 with only the public members.
            const previous = (readme.slice(startIdx, endIdx).match(/\.png\?size=100/g) || [])
              .length;
            if (previous > 0 && listed.length < previous * 0.5 && !allowShrink) {
              core.setFailed(
                `Refusing to rewrite the grid: ${listed.length} members now against ` +
                  `${previous} already rendered. That usually means the token lost ` +
                  'read:org and is only seeing public members. Re-dispatch with ' +
                  'allow_shrink=true if the drop is real.'
              );
              return;
            }

            // Resolve display names. listMembers returns the "simple user" shape,
            // which carries no name field.
            const people = [];
            let ghosts = 0;
            for (const m of listed) {
              let name = null;
              try {
                const { data } = await github.rest.users.getByUsername({ username: m.login });
                name = data.name;
              } catch (e) {
                if (e.status === 404) {
                  // Deleted account. The org still lists the membership, but the
                  // avatar 404s, which renders a broken image and drags that
                  // column out of shape for the whole table. Drop it rather than
                  // leave a hole. A transient error below keeps the member.
                  core.warning(`Skipping ${m.login}: account no longer exists.`);
                  ghosts++;
                  continue;
                }
                core.warning(`Could not read profile for ${m.login}: ${e.message}`);
              }
              people.push({ login: m.login, name: (name || m.login).trim() });
            }
            if (ghosts > 0) {
              core.info(`Dropped ${ghosts} deleted account(s) still listed by the org.`);
            }

            // Sorted so output is deterministic and reruns produce no diff.
            people.sort((a, b) => a.login.toLowerCase().localeCompare(b.login.toLowerCase()));

            const escape = (s) =>
              s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Avatar size and the absence of a td width are both load-bearing.
            //
            // GitHub's markdown CSS renders tables as `display: block; width:
            // max-content; max-width: 100%`, and injects `max-width: 100%;
            // height: auto` onto every image. So when a 6-wide table cannot fit
            // its container, some columns get squeezed and their avatars scale
            // down while others stay full size, which is what made the grid look
            // ragged. Measured across container widths from 375px to 896px:
            //
            //   6 across @ 80px  ->  ragged below 700px (58-80px at 650px)
            //   6 across @ 72px  ->  ragged by 16px
            //   6 across @ 64px  ->  ragged by 8px
            //   6 across @ 56px  ->  even at EVERY width, including 375px mobile
            //
            // At 56px the avatar is narrower than the username text, so the text
            // becomes the uniform width driver and no column gets squeezed. The
            // percentage td width made no difference either way, so it is gone.
            // Source stays at ?size=100 so the image is still crisp on retina.
            const cell = (p) =>
              [
                '    <td align="center" valign="top">',
                `      <a href="https://github.com/${p.login}">`,
                `        <img src="https://github.com/${p.login}.png?size=100" width="56" height="56" alt="${escape(p.login)}" />`,
                `        <br /><sub><b>${escape(p.name)}</b></sub>`,
                '      </a>',
                '    </td>',
              ].join('\n');

            const rows = [];
            for (let i = 0; i < people.length; i += PER_ROW) {
              rows.push(
                ['  <tr>', ...people.slice(i, i + PER_ROW).map(cell), '  </tr>'].join('\n')
              );
            }

            const block = [
              START,
              '',
              '<table>',
              ...rows,
              '</table>',
              '',
              `<sub>${people.length} member${people.length === 1 ? '' : 's'} of the organization, refreshed automatically. ` +
                'Would rather not be listed? Add your username to ' +
                '<a href="https://github.com/MCA-NITW/.github/blob/main/.github/members-optout.txt">.github/members-optout.txt</a> ' +
                'or ask an admin, and the next run drops you.</sub>',
              '',
              END,
            ].join('\n');

            // Keep the Members badge in step with the grid. A hardcoded count
            // next to a self-updating grid is guaranteed to drift the moment
            // anyone joins or leaves.
            const updated = (
              readme.slice(0, startIdx) +
              block +
              readme.slice(endIdx + END.length)
            ).replace(/(badge\/Members-)\d+(-blue)/, `$1${people.length}$2`);

            if (updated === readme) {
              core.info(`No change: ${people.length} member(s) already rendered.`);
              return;
            }

            fs.writeFileSync(path, updated);
            core.info(`Rendered ${people.length} member(s).`);

      - name: Commit if the grid changed
        run: |
          set -euo pipefail

          if git diff --quiet -- profile/README.md; then
            echo "profile/README.md unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(profile): refresh members grid"
          git push
